<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>popup</title>
        <style>
            body {
                font-family: Arial;
                background: #f0f0f0;
                width: 300px;
                padding: 10px;
            }
            textarea {
                width: 100%;
                height: 120px;
                background: white;
                border: 1px solid #ccc;
                padding: 8px;
                resize: none;
            }
            button {
                margin-top: 10px;
                width: 100%;
                padding: 10px;
                background: black;
                color: white;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background: #333;
            }
        </style>
    </head>
    <body>
        <textarea id="textInput" placeholder="Type or paste text here..."></textarea>
        <button id="typeBtn">Type</button>
        <script src="popup.js"></script>
    </body>
</html>
